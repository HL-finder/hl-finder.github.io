<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이스북 2단계 인증 바로가기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
      padding: 24px 16px;
      line-height: 1.5;
    }
    .card {
      max-width: 460px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .title {
      font-size: 1.35rem;
      font-weight: 900;
      color: #1877f2;
      margin-bottom: 10px;
    }
    .desc {
      font-size: 0.95rem;
      color: #4b4f56;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: #1877f2;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(24, 119, 242, 0.35);
    }
    .btn-secondary {
      background: #10b981;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-dark {
      background: #1e293b;
      color: #ffffff !important;
    }
    .guide-box {
      margin-top: 18px;
      background: #fff8db;
      border: 1px solid #f59e0b;
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      font-size: 0.88rem;
      color: #333;
    }
    .guide-box strong { color: #b45309; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">🔒 페이스북 2단계 인증 설정</div>
    <p class="desc">
      네이버 앱 내부에서는 페이스북 화면이 깨질 수 있습니다.<br />
      아래 버튼을 누르면 깨지지 않는 정식 창으로 바로 열립니다!
    </p>

    <!-- 1. 안드로이드 크롬 강제 실행 (네이버 앱 탈출) -->
    <a id="chromeBtn" href="intent://accountscenter.facebook.com/password_and_security/two_factor#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=https%3A%2F%2Faccountscenter.facebook.com%2Fpassword_and_security;end" class="btn btn-primary">
      🚀 1번: 깨짐 없이 크롬(Chrome)으로 바로 열기
    </a>

    <!-- 2. 구버전 페이스북 보안 설정 (네이버 앱에서도 안 깨지는 클래식 페이지) -->
    <a href="https://www.facebook.com/security/2fac/settings/" class="btn btn-secondary">
      📱 2번: 페이스북 2단계 인증 클래식 화면 열기
    </a>

    <!-- 3. 비즈니스 관리자 보안 설정 -->
    <a href="https://business.facebook.com/settings/security" class="btn btn-dark">
      🏢 3번: 비즈니스 관리자 보안 설정 열기
    </a>

    <div class="guide-box">
      <strong>💡 만약 그래도 네이버 앱에서 글씨가 겹쳐 보인다면?</strong><br />
      1. 네이버 앱 화면 <strong>오른쪽 맨 아래 <code>=</code> (줄 두 개 버튼)</strong> 터치<br />
      2. 옆으로 넘겨서 <strong><code>기본 브라우저로 열기</code></strong>(사파리/크롬)를 누르시면 100% 깨짐 없이 바로 열립니다!
    </div>
  </div>

  <script>
    // 아이폰(iOS)인 경우 1번 버튼을 사파리/정식 링크로 자동 연결
    var ua = navigator.userAgent || "";
    if (/iPhone|iPad|iPod/i.test(ua)) {
      document.getElementById("chromeBtn").href = "googlechrome://accountscenter.facebook.com/password_and_security";
    }
  </script>
</body>
</html>
